name: Temporary Packet Lily lockfile generator
on:
  push:
    branches:
      - hardening/packet-lock-20261017
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/hardening/packet-lock-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve reviewed Playwright dependency into reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this hardening branch only
        run: |
          set -euo pipefail
          test -s package-lock.json
          node -e "const p=require('./package-lock.json');if(p.lockfileVersion!==3 || p.packages[''].devDependencies['@playwright/test']!=='1.56.1')process.exit(1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'Lock Packet Lily Playwright test dependency tree'
            git push origin HEAD:hardening/packet-lock-20261017
          fi
