name: Test Packet Lily in real browsers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned testing tools (dev only)
        run: npm install --no-audit --no-fund
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Test simulated Android and iPhone invoice flows
        run: npm run test:browser
      - name: Upload failed-browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: packet-lily-browser-traces
          path: test-results/
          retention-days: 7
