name: Validate Packet Lily
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse every tracked JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(git ls-files -z -- '*.js' '*.cjs' '*.mjs')
          test "$count" -gt 0
          echo "Checked ${count} tracked JavaScript files."
      - name: Run no-dependency smoke tests
        run: node tests/smoke.cjs
