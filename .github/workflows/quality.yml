name: Validate Packet Lily
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check filing.js
          node --check tests/serve.cjs
          node --check tests/browser.spec.mjs
      - name: Run no-dependency smoke tests
        run: node tests/smoke.cjs
